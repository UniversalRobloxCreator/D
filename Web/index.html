<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0d">
  <title>Reminders — Блокнот</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <h1 class="logo">📝 Reminders</h1>
      </div>
      <div class="header-right">
        <button class="icon-btn" id="btn-settings" title="Настройки" aria-label="Настройки">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main content: list -->
    <main class="main" id="view-list">
      <div class="toolbar">
        <div class="filter-tabs">
          <button class="tab active" data-filter="all">Все</button>
          <button class="tab" data-filter="active">Активные</button>
          <button class="tab" data-filter="done">Отправленные</button>
        </div>
      </div>

      <div id="reminders-list" class="reminders-list">
        <!-- cards injected by JS -->
      </div>

      <div id="empty-state" class="empty-state hidden">
        <div class="empty-icon">📋</div>
        <p>Пока нет напоминаний</p>
        <p class="muted">Нажми «+» чтобы создать первое</p>
      </div>
    </main>

    <!-- Settings view -->
    <main class="main hidden" id="view-settings">
      <div class="settings-header">
        <button class="back-btn" id="btn-back">← Назад</button>
        <h2>Настройки стиля</h2>
      </div>

      <div class="settings-body">
        <section class="settings-section">
          <h3>Цвета</h3>
          <div class="color-grid">
            <label class="color-item">
              <span>Фон</span>
              <div class="color-picker" id="set-bg" data-key="bg"></div>
            </label>
            <label class="color-item">
              <span>Карточки</span>
              <div class="color-picker" id="set-card" data-key="card"></div>
            </label>
            <label class="color-item">
              <span>Поверхность</span>
              <div class="color-picker" id="set-surface" data-key="surface"></div>
            </label>
            <label class="color-item">
              <span>Акцент</span>
              <div class="color-picker" id="set-accent" data-key="accent"></div>
            </label>
            <label class="color-item">
              <span>Акцент (hover)</span>
              <div class="color-picker" id="set-accentHover" data-key="accentHover"></div>
            </label>
            <label class="color-item">
              <span>Текст</span>
              <div class="color-picker" id="set-text" data-key="text"></div>
            </label>
            <label class="color-item">
              <span>Приглушённый</span>
              <div class="color-picker" id="set-muted" data-key="muted"></div>
            </label>
            <label class="color-item">
              <span>Границы</span>
              <div class="color-picker" id="set-border" data-key="border"></div>
            </label>
          </div>
        </section>

        <section class="settings-section">
          <h3>Форма и анимация</h3>
          <div class="range-group">
            <label>
              <span>Скругление: <b id="val-radius">14</b>px</span>
              <input type="range" id="set-radius" data-key="radius" min="0" max="28" step="1" value="14">
            </label>
            <label>
              <span>Скорость анимации: <b id="val-transition">0.35</b>s</span>
              <input type="range" id="set-transition" data-key="transition" min="0.1" max="1" step="0.05" value="0.35">
            </label>
            <label>
              <span>Размытие (glass): <b id="val-blur">12</b>px</span>
              <input type="range" id="set-blur" data-key="blur" min="0" max="24" step="1" value="12">
            </label>
          </div>
          <label class="toggle-row">
            <span>Glass-эффект</span>
            <input type="checkbox" id="set-glass" data-key="glass">
            <span class="toggle-track"></span>
          </label>
        </section>

        <section class="settings-section">
          <h3>Шрифт</h3>
          <select id="set-fontFamily" data-key="fontFamily" class="select">
            <option value='system-ui, -apple-system, "Segoe UI", sans-serif'>System UI</option>
            <option value='"Inter", system-ui, sans-serif'>Inter</option>
            <option value='"SF Pro Display", system-ui, sans-serif'>SF Pro</option>
            <option value='"Roboto", system-ui, sans-serif'>Roboto</option>
            <option value='"JetBrains Mono", monospace'>JetBrains Mono</option>
            <option value='Georgia, serif'>Georgia (serif)</option>
          </select>
        </section>

        <section class="settings-section">
          <h3>Пресеты</h3>
          <div class="presets">
            <button class="preset-btn" data-preset="dark-red">Тёмно-красный</button>
            <button class="preset-btn" data-preset="midnight">Полночь</button>
            <button class="preset-btn" data-preset="emerald">Изумруд</button>
            <button class="preset-btn" data-preset="violet">Фиолет</button>
            <button class="preset-btn" data-preset="ocean">Океан</button>
            <button class="preset-btn" data-preset="light">Светлый</button>
          </div>
        </section>

        <div class="settings-actions">
          <button class="btn btn-secondary" id="btn-reset-style">Сбросить</button>
          <button class="btn btn-primary" id="btn-save-style">Сохранить</button>
        </div>
      </div>
    </main>

    <!-- FAB -->
    <button class="fab" id="btn-add" title="Добавить" aria-label="Добавить напоминание">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>

    <!-- Modal: Add / Edit -->
    <div class="modal-overlay hidden" id="modal">
      <div class="modal">
        <div class="modal-header">
          <h3 id="modal-title">Новое напоминание</h3>
          <button class="icon-btn" id="modal-close" aria-label="Закрыть">✕</button>
        </div>
        <form id="reminder-form" class="modal-body">
          <input type="hidden" id="edit-id">
          <label>
            <span>Заголовок</span>
            <input type="text" id="f-title" required maxlength="120" placeholder="Например: Позвонить маме">
          </label>
          <label>
            <span>Текст</span>
            <textarea id="f-text" rows="3" maxlength="1000" placeholder="Подробности (необязательно)"></textarea>
          </label>
          <label>
            <span>Дата и время</span>
            <div class="dt-picker" id="f-datetime"></div>
          </label>
          <label class="toggle-row">
            <span>Активно</span>
            <input type="checkbox" id="f-active" checked>
            <span class="toggle-track"></span>
          </label>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" id="modal-cancel">Отмена</button>
            <button type="submit" class="btn btn-primary">Сохранить</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="js/pickers.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
