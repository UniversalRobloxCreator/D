<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0d">
  <title>Заметки — Блокнот</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <button class="icon-btn header-home-btn" id="btn-home" title="Меню" aria-label="Меню">
          <span class="icon" data-icon="notes"></span>
        </button>
        <h1 class="logo">Заметки</h1>
      </div>
      <div class="header-right">
        <button class="icon-btn" id="btn-settings-shortcut" title="Настройки" aria-label="Настройки">
          <span class="icon" data-icon="gear"></span>
        </button>
      </div>
    </header>

    <!-- ── Главное меню ─────────────────────────────────────────── -->
    <main class="main" id="view-menu">
      <p class="menu-subtitle" id="menu-subtitle"></p>
      <div class="menu-grid">
        <button class="menu-btn" id="menu-create" data-icon="plus"></button>
        <button class="menu-btn" id="menu-notes" data-icon="notes"></button>
        <button class="menu-btn" id="menu-search" data-icon="search"></button>
        <button class="menu-btn" id="menu-settings" data-icon="gear"></button>
        <button class="menu-btn menu-btn-wide" id="menu-help" data-icon="help"></button>
      </div>
    </main>

    <!-- ── Список заметок ───────────────────────────────────────── -->
    <main class="main hidden" id="view-list">
      <div class="screen-header">
        <h2 id="list-title"></h2>
      </div>

      <div id="notes-list" class="reminders-list"></div>

      <div id="list-empty-state" class="empty-state hidden">
        <div class="empty-icon" data-icon="notes"></div>
        <p id="list-empty-title"></p>
        <p class="muted" id="list-empty-hint"></p>
      </div>

      <div class="pagination hidden" id="list-pagination">
        <button class="pg-btn" id="pg-prev" data-icon="chevronLeft"></button>
        <span class="pg-label" id="pg-label"></span>
        <button class="pg-btn" id="pg-next" data-icon="chevronRight"></button>
      </div>

      <button class="btn btn-secondary btn-block" id="list-to-menu" data-icon="home"></button>
    </main>

    <!-- ── Поиск ─────────────────────────────────────────────────── -->
    <main class="main hidden" id="view-search">
      <div class="screen-header">
        <h2 id="search-title"></h2>
      </div>

      <div class="search-bar">
        <input type="text" id="search-input" class="search-input" autocomplete="off">
        <button class="icon-btn search-go-btn" id="search-go" data-icon="search"></button>
      </div>

      <p class="search-count muted hidden" id="search-count"></p>

      <div id="search-results" class="reminders-list"></div>

      <div id="search-empty-state" class="empty-state hidden">
        <div class="empty-icon" data-icon="search"></div>
        <p id="search-empty-label"></p>
      </div>

      <button class="btn btn-secondary btn-block" id="search-to-menu" data-icon="home"></button>
    </main>

    <!-- ── Карточка заметки ─────────────────────────────────────── -->
    <main class="main hidden" id="view-note">
      <div class="screen-header">
        <h2 id="note-detail-title"></h2>
      </div>

      <div class="note-card">
        <p class="note-full-text" id="note-detail-text"></p>
        <div class="note-meta-row">
          <span id="note-detail-status" class="badge"></span>
        </div>
        <div class="note-meta-row muted" id="note-detail-created"></div>
        <div class="note-meta-row muted" id="note-detail-remind"></div>
      </div>

      <div class="note-actions-grid">
        <button class="btn btn-secondary" id="note-btn-edit" data-icon="pencil"></button>
        <button class="btn btn-secondary" id="note-btn-remind" data-icon="remind"></button>
        <button class="btn btn-danger" id="note-btn-delete" data-icon="trash"></button>
        <button class="btn btn-secondary" id="note-btn-menu" data-icon="home"></button>
      </div>
    </main>

    <!-- ── Настройки ─────────────────────────────────────────────── -->
    <main class="main hidden" id="view-settings">
      <div class="settings-header">
        <button class="back-btn" id="btn-back-settings">
          <span class="icon" data-icon="chevronLeft"></span>
        </button>
        <h2 id="settings-title-text"></h2>
      </div>

      <div class="settings-body">
        <section class="settings-section">
          <h3 id="settings-snooze-title"></h3>
          <p class="muted settings-hint" id="settings-snooze-hint"></p>
          <div class="snooze-options" id="snooze-options"></div>
          <input type="number" id="snooze-custom" class="modal-body-input" min="1" max="1440">
        </section>

        <section class="settings-section">
          <h3>Цвета</h3>
          <div class="color-grid">
            <label class="color-item">
              <span>Фон</span>
              <div class="color-picker" id="set-bg" data-key="bg"></div>
            </label>
            <label class="color-item">
              <span>Карточки</span>
              <div class="color-picker" id="set-card" data-key="card"></div>
            </label>
            <label class="color-item">
              <span>Поверхность</span>
              <div class="color-picker" id="set-surface" data-key="surface"></div>
            </label>
            <label class="color-item">
              <span>Акцент</span>
              <div class="color-picker" id="set-accent" data-key="accent"></div>
            </label>
            <label class="color-item">
              <span>Акцент (hover)</span>
              <div class="color-picker" id="set-accentHover" data-key="accentHover"></div>
            </label>
            <label class="color-item">
              <span>Текст</span>
              <div class="color-picker" id="set-text" data-key="text"></div>
            </label>
            <label class="color-item">
              <span>Приглушённый</span>
              <div class="color-picker" id="set-muted" data-key="muted"></div>
            </label>
            <label class="color-item">
              <span>Границы</span>
              <div class="color-picker" id="set-border" data-key="border"></div>
            </label>
          </div>
        </section>

        <section class="settings-section">
          <h3>Форма и анимация</h3>
          <div class="range-group">
            <label>
              <span>Скругление: <b id="val-radius">14</b>px</span>
              <input type="range" id="set-radius" data-key="radius" min="0" max="28" step="1" value="14">
            </label>
            <label>
              <span>Скорость анимации: <b id="val-transition">0.35</b>s</span>
              <input type="range" id="set-transition" data-key="transition" min="0.1" max="1" step="0.05" value="0.35">
            </label>
            <label>
              <span>Размытие (glass): <b id="val-blur">12</b>px</span>
              <input type="range" id="set-blur" data-key="blur" min="0" max="24" step="1" value="12">
            </label>
          </div>
          <label class="toggle-row">
            <span>Glass-эффект</span>
            <input type="checkbox" id="set-glass" data-key="glass">
            <span class="toggle-track"></span>
          </label>
        </section>

        <section class="settings-section">
          <h3>Шрифт</h3>
          <select id="set-fontFamily" data-key="fontFamily" class="select">
            <option value='system-ui, -apple-system, "Segoe UI", sans-serif'>System UI</option>
            <option value='"Inter", system-ui, sans-serif'>Inter</option>
            <option value='"SF Pro Display", system-ui, sans-serif'>SF Pro</option>
            <option value='"Roboto", system-ui, sans-serif'>Roboto</option>
            <option value='"JetBrains Mono", monospace'>JetBrains Mono</option>
            <option value='Georgia, serif'>Georgia (serif)</option>
          </select>
        </section>

        <section class="settings-section">
          <h3>Пресеты</h3>
          <div class="presets">
            <button class="preset-btn" data-preset="dark-red">Тёмно-красный</button>
            <button class="preset-btn" data-preset="midnight">Полночь</button>
            <button class="preset-btn" data-preset="emerald">Изумруд</button>
            <button class="preset-btn" data-preset="violet">Фиолет</button>
            <button class="preset-btn" data-preset="ocean">Океан</button>
            <button class="preset-btn" data-preset="light">Светлый</button>
          </div>
        </section>

        <div class="settings-actions">
          <button class="btn btn-secondary" id="btn-reset-style">Сбросить</button>
          <button class="btn btn-primary" id="btn-save-style"></button>
        </div>
      </div>
    </main>

    <!-- ── Помощь ────────────────────────────────────────────────── -->
    <main class="main hidden" id="view-help">
      <div class="screen-header">
        <h2 id="help-title-text"></h2>
      </div>
      <ul class="help-list" id="help-list"></ul>
      <button class="btn btn-secondary btn-block" id="help-to-menu" data-icon="home"></button>
    </main>

    <!-- FAB (виден только в списке заметок) -->
    <button class="fab hidden" id="btn-add" title="Добавить" aria-label="Добавить заметку">
      <span class="icon" data-icon="plus"></span>
    </button>

    <!-- Modal: создание / редактирование заметки -->
    <div class="modal-overlay hidden" id="modal">
      <div class="modal">
        <div class="modal-header">
          <h3 id="modal-title"></h3>
          <button class="icon-btn" id="modal-close" data-icon="close" aria-label="Закрыть"></button>
        </div>
        <form id="note-form" class="modal-body">
          <input type="hidden" id="edit-id">
          <label>
            <span id="note-text-label"></span>
            <textarea id="f-text" rows="5" maxlength="2000"></textarea>
          </label>
          <label class="toggle-row">
            <span id="note-remind-toggle-label"></span>
            <input type="checkbox" id="f-remind-toggle">
            <span class="toggle-track"></span>
          </label>
          <label id="f-datetime-wrap" class="hidden">
            <span id="note-remind-time-label"></span>
            <div class="dt-picker" id="f-datetime"></div>
          </label>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" id="modal-cancel"></button>
            <button type="submit" class="btn btn-primary" id="modal-submit">
              <span class="btn-icon-swap" id="modal-submit-icon" data-icon="check"></span>
              <span id="modal-submit-label"></span>
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Modal: быстрая установка/изменение напоминания -->
    <div class="modal-overlay hidden" id="modal-remind">
      <div class="modal">
        <div class="modal-header">
          <h3 id="modal-remind-title"></h3>
          <button class="icon-btn" id="modal-remind-close" data-icon="close" aria-label="Закрыть"></button>
        </div>
        <div class="modal-body">
          <label>
            <span id="note-remind-time-label-2"></span>
            <div class="dt-picker" id="r-datetime"></div>
          </label>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" id="modal-remind-clear"></button>
            <button type="button" class="btn btn-primary" id="modal-remind-save">
              <span class="btn-icon-swap" id="remind-submit-icon" data-icon="check"></span>
              <span id="modal-remind-save-label"></span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="js/texts.js"></script>
  <script src="js/pickers.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
